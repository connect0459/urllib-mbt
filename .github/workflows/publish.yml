name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Verify tag matches module version
        run: |
          version="$(awk -F'"' '/^version[[:space:]]*=/{ print $2; exit }' moon.mod)"
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$version"

      - name: Check
        run: moon check --target native

      - name: Test
        run: moon test --target native

      - name: Publish to mooncakes
        run: |
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json
        env:
          SECRET: ${{ secrets.MOONCAKES_TOKEN }}
