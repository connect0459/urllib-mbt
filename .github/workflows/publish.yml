name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

run-name: Publish ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup WPT submodule (sparse, pinned)
        run: bash tools/setup_wpt.sh

      - name: Setup Moonbit
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        run: moon update

      - name: Verify tag matches module version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          version="$(awk -F'"' '/^version[[:space:]]*=/{ print $2; exit }' moon.mod)"
          tag="${TAG#v}"
          test "$tag" = "$version"

      - name: Check
        run: moon check --target all

      - name: Test
        run: moon test --target all

      - name: Publish to mooncakes
        run: |
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json
        env:
          SECRET: ${{ secrets.MOONCAKES_CREDENTIALS }}

  # Runs only after mooncakes publish has succeeded, so a GitHub Release is
  # never created for a version that failed to publish. On workflow_dispatch
  # dry runs the job still executes (mirroring `publish`, which itself is not
  # gated to push events) but each step below skips via its own `if`, since
  # CHANGELOG.md only ever has a section for a real tagged release.
  create-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Extract changelog section for this version
        if: github.event_name == 'push'
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$RELEASE_VERSION" '
            /^## \[/ {
              if (capture) exit
              if (index($0, "## [" ver "]") == 1) { capture = 1; next }
            }
            /^---/ { if (capture) exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for [$RELEASE_VERSION]. Retitle [Unreleased] to [$RELEASE_VERSION] - YYYY-MM-DD before tagging."
            exit 1
          fi

          # Append a Full Changelog comparison link, reusing the compare URL
          # CHANGELOG.md's own reference-link section already tracks for this
          # version (skipped for the very first release, which links to the
          # tag itself rather than a compare view).
          COMPARE_URL="$(awk -v ver="$RELEASE_VERSION" '
            index($0, "[" ver "]: ") == 1 {
              sub(/^\[[^]]*\]: </, "")
              sub(/>$/, "")
              print
              exit
            }
          ' CHANGELOG.md)"

          if [[ "$COMPARE_URL" == *"/compare/"* ]]; then
            printf '\n**Full Changelog**: %s\n' "$COMPARE_URL" >> release-notes.md
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
