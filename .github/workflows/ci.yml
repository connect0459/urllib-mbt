name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

run-name: CI on ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect changed files to skip subsequent steps when no relevant files are modified
      - name: Detect changed files
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - '.gitmodules'
              - 'internal/**'
              - 'moon.mod'
              - 'moon.pkg'
              - 'tools/setup_wpt.sh'
              - 'url/**'
              - 'urlpattern/**'

      - name: Setup Moonbit
        if: steps.filter.outputs.code == 'true'
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        if: steps.filter.outputs.code == 'true'
        run: moon update

      - name: Check formatting
        if: steps.filter.outputs.code == 'true'
        run: moon fmt --check

      - name: Check packages
        if: steps.filter.outputs.code == 'true'
        run: moon check --deny-warn --target all

      - name: Verify generated interfaces are current
        if: steps.filter.outputs.code == 'true'
        run: moon info && git diff --exit-code

      - name: Skip CI checks (no relevant changes)
        if: steps.filter.outputs.code != 'true'
        run: echo "No changes detected in code-related files."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect changed files to skip subsequent steps when no relevant files are modified
      - name: Detect changed files
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '.github/workflows/ci.yml'
              - '.gitmodules'
              - 'internal/**'
              - 'moon.mod'
              - 'moon.pkg'
              - 'tools/setup_wpt.sh'
              - 'url/**'
              - 'urlpattern/**'

      - name: Setup WPT submodule (sparse, pinned)
        if: steps.filter.outputs.code == 'true'
        run: bash tools/setup_wpt.sh

      - name: Setup Moonbit
        if: steps.filter.outputs.code == 'true'
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        if: steps.filter.outputs.code == 'true'
        run: moon update

      - name: Test all targets
        if: steps.filter.outputs.code == 'true'
        run: moon test --target all

      - name: Skip CI checks (no relevant changes)
        if: steps.filter.outputs.code != 'true'
        run: echo "No changes detected in code-related files."
